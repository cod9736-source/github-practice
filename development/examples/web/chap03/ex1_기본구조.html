<!--이 문서가 html 문서임을 브라우저한테 알리는 부분으로 반드시 첫 행에 작성-->
<!doctype html>
<!--html문서라면 가지는 기본 태그, 다른 모든 태그는 html태그 내에 작성-->
<html>
  <!--브라우저에게 전달할 정보 작성-->
  <head>
    <!--문자 인코딩 설정-->
    <!--인코딩 : 사용자가 입력한 문자나 기호들을 컴퓨터가 이해할 수 있는 형태로 변환-->
    <meta charset="utf-8" />
    <!--페이지 제목 설정-->
    <title>title</title>
  </head>

  <body>
    <!--페이지 내용
    -실제로 사용자가 보는 모든 내용은 body태그 내부에 작성
    -->
  </body>
</html>
