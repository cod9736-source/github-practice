<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>리스트 태그 연습</title>
  </head>
  <body>
    <h2>리스트 태그 연습</h2>
    <h3>순서가 있는 리스트(ol)</h3>
    <ol>
      <!--순서가 있는 리스트, 순번을 자동으로 부여함-->
      <li>항목 1</li>
      <li>항목 2</li>
      <li>항목 3</li>
    </ol>
    <h3>순서가 없는 리스트(ul)</h3>
    <ul>
      <!--순서가 없는 리스트, 마커를 자동으로 부여함-->
      <li>항목 1</li>
      <li>항목 2</li>
      <li>항목 3</li>
    </ul>
  </body>
</html>
