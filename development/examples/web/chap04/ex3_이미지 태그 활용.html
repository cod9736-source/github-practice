<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이미지 태그 활용</title>
  </head>
  <body>
    <h2>이미지 태그 활용</h2>
    <!--이미지 태그에는 반드시 src, alt 속성이 필요-->
    <!--아직 자료가 없을 때 비워 두지 않고 "#"으로 적는 이유는 나중에 
  자료가 준비되면 "#"을 검색해서 src 속성의 값을 변경하면 됩니다-->
    <img src="#" alt="귀여운 강아지" />
    <img src="images/dog.png" alt="귀여운 강아지" />
    <img src="images/dog.png" alt="귀여운 강아지" width="120" />
    <img src="images/dog.png" alt="귀여운 강아지" width="120" height="120" />
    <img src="images/dog.png" alt="귀여운 강아지" width="50%" />
    <!--이미지는 인라인블록으로 한줄을 다 차지 하는 것이 아닌 본인 사이즈만큼만 자리를 차지함-->

    <h3>이미지에 링크</h3>
    <a href="https://youtube.com/shorts/2LA6n7bBLlk?si=sFeUsHw0prtkHghl">
      <img src="images/dog2.png" alt="딸기먹는 치와와" width="30%" />
    </a>
  </body>
</html>
