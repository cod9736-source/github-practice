apiVersion: v1                         # Kubernetes API 버전 지정
kind: Pod                              # 생성할 Kubernetes 객체(Resource) 종류를 Pod로 지정

metadata:                              # Pod의 Metadata(식별 정보) 영역
  name: nginx-mysql                    # 생성할 Pod 이름 지정
  labels:                              # Pod를 식별하거나 그룹화하기 위한 Label 설정
    app: nginx                         # app이라는 Key에 nginx라는 Value를 부여

spec:                                  # Pod의 실제 실행 설정 영역
  containers:                          # Pod 내부에서 실행할 Container 목록
    - name: nginx                      # 첫 번째 Container 이름 지정
      image: nginx:latest              # Docker Hub에서 nginx 최신 Image 사용
    - name: mysql                      # 두 번째 Container 이름 지정
      image: mysql:latest              # Docker Hub에서 MySQL 최신 Image 사용
      env:                             # Container 내부에서 사용할 환경 변수 설정
        - name: MYSQL_ROOT_PASSWORD    # MySQL root 계정 비밀번호 환경 변수 이름
          value: "<MYSQL_ROOT_PASSWORD>"                # MySQL root 계정 비밀번호 값 지정
      ports:                           # MySQL Container가 사용하는 Network Port 설정
        - containerPort: 3306          # MySQL Container 내부의 3306 Port 사용
