! Source: Notion lab01 / L3 Switch 1 / fetched 2026-10-02 UTC
! Configuration transcribed from notes; not a running-config export.
! 관리자 모드로 전환
enable

! 장비 설정 모드로 진입
configure terminal

! 서로 다른 Network 사이로 데이터를 전달하는 기능 활성화
ip routing

! 왼쪽 Router와 연결된 Port 선택
interface gigabitEthernet0/1

! 선택한 Port를 주소를 직접 설정하는 Routing Port로 전환
no switchport

! 왼쪽 Router와 연결되는 이쪽 Port의 주소와 Mask 설정
ip address 1.0.0.2 255.0.0.0

! 선택한 Port를 켜기
no shutdown

! 장비 전체 설정 모드로 복귀
exit

! 위쪽 컴퓨터 6번과 연결된 Port 선택
interface fastEthernet0/1

! 선택한 Port를 주소를 직접 설정하는 Routing Port로 전환
no switchport

! 컴퓨터 6번이 사용할 출입구 주소와 Mask 설정
ip address 192.168.10.1 255.255.255.0

! 선택한 Port를 켜기
no shutdown

! 장비 전체 설정 모드로 복귀
exit

! 아래쪽 Router 1번과 연결된 Port 선택
interface fastEthernet0/24

! 선택한 Port를 주소를 직접 설정하는 Routing Port로 전환
no switchport

! 아래쪽 Router와 연결되는 이쪽 Port의 주소와 Mask 설정
ip address 2.0.0.1 255.0.0.0

! 선택한 Port를 켜기
no shutdown

! 장비 전체 설정 모드로 복귀
exit

! 다른 경로 연결 장비와 Network 정보를 주고받는 설정 시작
router rip

! Subnet Mask 정보도 전달하는 RIP Version 2 사용
version 2

! 나눈 Network 범위를 그대로 전달하도록 자동 요약 해제
no auto-summary

! 왼쪽 Router와 연결된 Port를 RIP에 포함
network 1.0.0.0

! 위쪽 컴퓨터가 연결된 Network를 RIP에 포함
network 192.168.10.0

! 아래쪽 Router와 연결된 Port를 RIP에 포함
network 2.0.0.0

! 장비 전체 설정 모드로 복귀
exit

! 설정 모드를 종료하고 관리자 모드로 복귀
end

! 장비를 재시작해도 유지되도록 현재 설정 저장
write memory
