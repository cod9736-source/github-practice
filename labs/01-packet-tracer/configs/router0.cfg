! Source: Notion lab01 / Router 0 / fetched 2026-10-02 UTC
! Configuration transcribed from notes; not a running-config export.
! 관리자 모드로 전환
enable

! 장비 설정 모드로 진입
configure terminal

! 명령어 창에 표시되는 장비 이름을 Router0으로 설정
hostname Router0

! 위쪽 컴퓨터와 연결된 Port 선택
interface gigabitEthernet0/0

! 위쪽 컴퓨터의 출입구 주소와 /25 Subnet Mask 설정
ip address 192.168.20.1 255.255.255.128

! 선택한 Port를 켜기
no shutdown

! Port 설정을 나와 장비 전체 설정 모드로 복귀
exit

! 아래쪽 컴퓨터와 연결된 Port 선택
interface gigabitEthernet0/2

! 아래쪽 컴퓨터의 출입구 주소와 /25 Subnet Mask 설정
ip address 192.168.20.129 255.255.255.128

! 선택한 Port를 켜기
no shutdown

! Port 설정을 나와 장비 전체 설정 모드로 복귀
exit

! 오른쪽 L3 Switch와 연결된 Port 선택
interface gigabitEthernet0/1

! 장비 사이 연결에 사용할 주소와 /8 Subnet Mask 설정
ip address 1.0.0.1 255.0.0.0

! 선택한 Port를 켜기
no shutdown

! Port 설정을 나와 장비 전체 설정 모드로 복귀
exit

! 다른 장비와 통신 경로를 주고받는 설정 모드로 진입
router rip

! Subnet Mask 정보도 전달할 수 있는 RIP Version 2 사용
version 2

! 나눈 Network 범위를 그대로 전달하도록 자동 요약 해제
no auto-summary

! 192.168.20.0/25와 192.168.20.128/25가 연결된 두 Port를 RIP에 포함
network 192.168.20.0

! 오른쪽 L3 Switch로 이어지는 1.0.0.0/8 연결 Port를 RIP에 포함
network 1.0.0.0

! RIP 설정을 나와 장비 전체 설정 모드로 복귀
exit

! 설정 모드를 종료하고 관리자 모드로 복귀
end

! 장비를 재시작해도 유지되도록 현재 설정 저장
write memory
