! Source: Notion lab01 / Router 1 / fetched 2026-10-02 UTC
! Configuration transcribed from notes; not a running-config export.
! 관리자 모드 진입
enable
! 전체 설정 모드 진입
configure terminal

! 위쪽 L3 Switch1과 연결된 0/2 Port 선택
interface gigabitEthernet0/2
! 주소와 /8 Subnet Mask 설정
ip address 2.0.0.2 255.0.0.0
! Port 활성화
no shutdown
! 전체 설정으로 돌아가기
exit

! 왼쪽 L3 Switch0과 연결된 0/1 Port 선택
interface gigabitEthernet0/1
! 주소와 /8 Subnet Mask 설정
ip address 3.0.0.2 255.0.0.0
! Port 활성화
no shutdown
! 전체 설정으로 돌아가기
exit

! 오른쪽 Router2와 연결된 0/0 Port 선택
interface gigabitEthernet0/0
! 주소와 /8 Subnet Mask 설정
ip address 4.0.0.1 255.0.0.0
! Port 활성화
no shutdown
! 전체 설정으로 돌아가기
exit

! RIP Routing 설정 모드 진입
router rip
! RIP Version 2 사용
version 2
! Network 자동 요약 해제
no auto-summary
! 위쪽 연결 대역을 RIP에 포함
network 2.0.0.0
! 왼쪽 연결 대역을 RIP에 포함
network 3.0.0.0
! 오른쪽 연결 대역을 RIP에 포함
network 4.0.0.0
! 전체 설정으로 돌아가기
exit

! 설정 모드 종료
end
! 현재 설정 저장
write memory
