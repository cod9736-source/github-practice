! Source: Notion lab01 / L3 Switch 2 / fetched 2026-10-02 UTC
! Configuration transcribed from notes; not a running-config export.
enable
! 전체 설정 모드 진입 -> 장비 설정을 변경하기 위해
configure terminal

! Routing 기능 활성화 -> 서로 다른 Network 대역 사이로 데이터를 전달하기 위해
ip routing

! 10번 그룹 생성 -> 컴퓨터3와 노트북1의 그룹을 이 장비에서도 사용하기 위해
vlan 10
! 전체 설정으로 돌아가기 -> 다음 VLAN을 만들기 위해
exit

! 20번 그룹 생성 -> 컴퓨터4의 그룹을 이 장비에서도 사용하기 위해
vlan 20
! 전체 설정으로 돌아가기 -> Switch6 연결 Port를 설정하기 위해
exit

! 0/1 Port 선택 -> Switch6으로 이어지는 연결을 설정하기 위해
interface fastEthernet0/1
! VLAN 번호 표시 방식 지정 -> 10번과 20번 데이터를 구분해서 전달하기 위해
switchport trunk encapsulation dot1q
! 여러 VLAN을 전달하는 방식으로 설정 -> 한 연결로 두 그룹의 데이터를 운반하기 위해
switchport mode trunk
! 통과할 VLAN을 10번과 20번으로 지정 -> 이 연결에서 필요한 두 그룹을 전달하기 위해
switchport trunk allowed vlan 10,20
! Port 활성화 -> Switch6과 연결을 사용할 수 있도록
no shutdown
! 전체 설정으로 돌아가기 -> VLAN별 Gateway를 설정하기 위해
exit

! 10번 가상 Interface 선택 -> 10번 그룹의 Gateway를 설정하기 위해
interface vlan 10
! Gateway 주소와 /26 Mask 설정 -> 컴퓨터3와 노트북1이 다른 대역으로 나갈 출입구를 만들기 위해
ip address 192.168.70.1 255.255.255.192
! 가상 Interface 활성화 -> 10번 그룹의 Gateway를 사용하기 위해
no shutdown
! 전체 설정으로 돌아가기 -> 20번 그룹의 Gateway를 설정하기 위해
exit

! 20번 가상 Interface 선택 -> 20번 그룹의 Gateway를 설정하기 위해
interface vlan 20
! Gateway 주소와 /26 Mask 설정 -> 컴퓨터4가 다른 대역으로 나갈 출입구를 만들기 위해
ip address 192.168.70.65 255.255.255.192
! 가상 Interface 활성화 -> 20번 그룹의 Gateway를 사용하기 위해
no shutdown
! 전체 설정으로 돌아가기 -> Server1 쪽 Port를 설정하기 위해
exit

! 0/2 Port 선택 -> Switch8을 통해 Server1로 이어지는 연결을 설정하기 위해
interface fastEthernet0/2
! Routing Port로 전환 -> 이 물리 Port에 주소를 직접 넣기 위해
no switchport
! 주소와 /26 Mask 설정 -> 이 Port를 Server1의 Gateway로 사용하기 위해
ip address 192.168.70.129 255.255.255.192
! Port 활성화 -> Server1 쪽 연결을 사용하기 위해
no shutdown
! 전체 설정으로 돌아가기 -> Server2 쪽 Port를 설정하기 위해
exit

! 0/3 Port 선택 -> Switch9를 통해 Server2로 이어지는 연결을 설정하기 위해
interface fastEthernet0/3
! Routing Port로 전환 -> 이 물리 Port에 주소를 직접 넣기 위해
no switchport
! 주소와 /26 Mask 설정 -> 이 Port를 Server2의 Gateway로 사용하기 위해
ip address 192.168.70.193 255.255.255.192
! Port 활성화 -> Server2 쪽 연결을 사용하기 위해
no shutdown
! 전체 설정으로 돌아가기 -> Router2 쪽 Port를 설정하기 위해
exit

! 0/1 Port 선택 -> 아래쪽 Router2와의 연결을 설정하기 위해
interface gigabitEthernet0/1
! Routing Port로 전환 -> Router2와 연결할 주소를 직접 넣기 위해
no switchport
! 주소와 /8 Mask 설정 -> Router2의 5.0.0.1과 같은 대역으로 연결하기 위해
ip address 5.0.0.2 255.0.0.0
! Port 활성화 -> Router2와 연결을 사용하기 위해
no shutdown
! 전체 설정으로 돌아가기 -> RIP 경로 교환을 설정하기 위해
exit

! RIP 설정 모드 진입 -> Router2와 경로 정보를 주고받기 위해
router rip
! RIP Version 2 사용 -> Subnet Mask 정보도 함께 전달하기 위해
version 2
! 자동 요약 해제 -> 네 개의 /26 대역을 구분해서 다른 Router에 알려주기 위해
no auto-summary
! 5.0.0.0 대역을 RIP에 포함 -> Router2 연결 구간에서 경로 정보를 교환하기 위해
network 5.0.0.0
! 오른쪽 네 개의 /26 대역을 RIP에 포함 -> VLAN과 Server Network의 경로를 다른 Router에 알려주기 위해
network 192.168.70.0
! 전체 설정으로 돌아가기 -> RIP 설정을 마치기 위해
exit

! 관리자 모드로 돌아가기 -> 설정을 저장하기 위해
end
! 현재 설정 저장 -> 재부팅 후에도 설정을 유지하기 위해
write memory
