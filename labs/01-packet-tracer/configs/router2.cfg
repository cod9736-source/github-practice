! Source: Notion lab01 / Router 2 / fetched 2026-10-02 UTC
! Configuration transcribed from notes; not a running-config export.
! 관리자 모드로 진입
enable
! 설정 모드로 진입
configure terminal

! 왼쪽 Router1에 연결된 0/0 Port 선택
interface gigabitEthernet0/0
! Router1과 연결하는 주소와 /8 Mask 설정
ip address 4.0.0.2 255.0.0.0
! Port 활성화
no shutdown
! Port 설정에서 나가기
exit

! 위쪽 L3 Switch에 연결된 0/1 Port 선택
interface gigabitEthernet0/1
! 위쪽 Switch와 연결하는 주소와 /8 Mask 설정
ip address 5.0.0.1 255.0.0.0
! Port 활성화
no shutdown
! Port 설정에서 나가기
exit

! 아래쪽 Switch5에 연결된 0/2 Port 선택
interface gigabitEthernet0/2
! Laptop2의 Gateway 주소와 /24 Mask 설정
ip address 192.168.60.1 255.255.255.0
! Port 활성화
no shutdown
! Port 설정에서 나가기
exit

! RIP 경로 교환 설정으로 진입
router rip
! Subnet Mask도 전달하는 RIP Version 2 사용
version 2
! 나누어진 Network 정보를 자동으로 합쳐서 전달하지 않도록 설정
no auto-summary
! 왼쪽 Router1 연결 구간을 RIP에 포함
network 4.0.0.0
! 위쪽 L3 Switch 연결 구간을 RIP에 포함
network 5.0.0.0
! 아래쪽 Laptop2 Network를 RIP에 포함
network 192.168.60.0
! RIP 설정에서 나가기
exit

! 설정 모드 종료
end
! 현재 설정 저장
write memory
