! Source: Notion lab01 / Switch 3 / fetched 2026-10-02 UTC
! Configuration transcribed from notes; not a running-config export.
! 관리자 모드로 진입
enable

! 전체 설정 모드로 진입
configure terminal

! 컴퓨터가 소속될 10번 가상 Network 생성
vlan 10

! 전체 설정 모드로 돌아가기
exit

! Switch 2와 가상 Network 목록을 맞추기 위해 20번도 생성
vlan 20

! 전체 설정 모드로 돌아가기
exit

! 컴퓨터 2가 연결된 0/1 Port 선택
interface fastEthernet0/1

! 이 Port를 하나의 가상 Network에 소속시켜 사용하는 방식으로 설정
switchport mode access

! 이 Port를 10번 가상 Network에 소속시킴
switchport access vlan 10

! Port 활성화
no shutdown

! 전체 설정 모드로 돌아가기
exit

! Switch 2와 연결된 이 장비의 0/23 Port 선택
interface fastEthernet0/23

! 여러 가상 Network의 데이터를 운반하는 연결로 설정
switchport mode trunk

! 이 Port에서 10번과 20번 가상 Network의 데이터를 통과시킴
switchport trunk allowed vlan 10,20

! Port 활성화
no shutdown

! 전체 설정 모드로 돌아가기
exit

! 설정 모드를 종료하고 관리자 모드로 이동
end

! 재부팅 후에도 유지되도록 설정 저장
write memory
