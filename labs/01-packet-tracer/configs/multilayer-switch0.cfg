! Source: Notion lab01 / L3 Switch 0 / fetched 2026-10-02 UTC
! Configuration transcribed from notes; not a running-config export.
! 관리자 모드로 진입
enable
! 전체 설정 모드로 진입
configure terminal
! 서로 다른 Network 사이로 데이터를 전달하는 기능 활성화
ip routing

! 이 Switch에 10번 그룹 생성
vlan 10
! 전체 설정 모드로 돌아가기
exit
! 이 Switch에 20번 그룹 생성
vlan 20
! 전체 설정 모드로 돌아가기
exit

! Switch 2와 연결된 0/1 Port 선택
interface fastEthernet0/1
! 데이터에 그룹 번호를 표시하는 방식을 dot1q로 지정
switchport trunk encapsulation dot1q
! 이 Port를 여러 그룹의 데이터를 운반하는 방식으로 설정
switchport mode trunk
! 이 Port에서 10번과 20번 그룹의 데이터를 통과시킴
switchport trunk allowed vlan 10,20
! Port 활성화
no shutdown
! 전체 설정 모드로 돌아가기
exit

! 10번 그룹의 Gateway용 가상 Interface 생성 및 선택
interface vlan 10
! 10번 그룹의 Gateway 주소와 Subnet Mask 설정
ip address 192.168.30.1 255.255.255.0
! 가상 Interface 활성화
no shutdown
! 전체 설정 모드로 돌아가기
exit

! 20번 그룹의 Gateway용 가상 Interface 생성 및 선택
interface vlan 20
! 20번 그룹의 Gateway 주소와 Subnet Mask 설정
ip address 192.168.40.1 255.255.255.0
! 가상 Interface 활성화
no shutdown
! 전체 설정 모드로 돌아가기
exit

! 아래 Switch 4와 연결된 0/3 Port 선택
interface fastEthernet0/3
! 이 Port를 주소를 직접 설정하는 3계층 Routing Port로 전환
no switchport
! Server 0의 Gateway 주소와 Subnet Mask 설정
ip address 192.168.50.1 255.255.255.0
! Port 활성화
no shutdown
! 전체 설정 모드로 돌아가기
exit

! 중앙 Router 1과 연결된 0/1 Port 선택
interface gigabitEthernet0/1
! 이 Port를 주소를 직접 설정하는 3계층 Routing Port로 전환
no switchport
! 중앙 Router와 연결되는 이쪽 Port의 주소 설정
ip address 3.0.0.1 255.0.0.0
! Port 활성화
no shutdown
! 전체 설정 모드로 돌아가기
exit

! 다른 Routing 장비와 경로 정보를 주고받는 설정 시작
router rip
! Subnet Mask를 함께 전달하는 RIP Version 2 사용
version 2
! 세부 주소 범위를 자동으로 묶어서 알려주지 않도록 설정
no auto-summary
! 10번 그룹의 Network를 RIP에 포함
network 192.168.30.0
! 20번 그룹의 Network를 RIP에 포함
network 192.168.40.0
! 아래 Server 0의 Network를 RIP에 포함
network 192.168.50.0
! 중앙 Router와 연결되는 Network를 RIP에 포함
network 3.0.0.0
! 전체 설정 모드로 돌아가기
exit
! 설정 모드를 종료하고 관리자 모드로 이동
end
! 재부팅 후에도 유지되도록 설정 저장
write memory
