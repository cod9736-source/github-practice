! Source: Notion lab01 / Switch 2 / fetched 2026-10-02 UTC
! Configuration transcribed from notes; not a running-config export.
! 관리자 모드로 진입
enable

! 전체 설정 모드로 진입
configure terminal

! Switch에 10번 가상 Network 생성
vlan 10

! 전체 설정 모드로 돌아가기
exit

! Switch에 20번 가상 Network 생성
vlan 20

! 전체 설정 모드로 돌아가기
exit

! 노트북 0이 연결된 0/1 Port 선택
interface fastEthernet0/1

! 한 가상 Network에 소속되는 단말 연결 방식으로 설정
switchport mode access

! 이 Port를 10번 가상 Network에 소속시킴
switchport access vlan 10

! Port 활성화
no shutdown

! 전체 설정 모드로 돌아가기
exit

! Server 3이 연결된 0/2 Port 선택
interface fastEthernet0/2

! 한 가상 Network에 소속되는 단말 연결 방식으로 설정
switchport mode access

! 이 Port를 20번 가상 Network에 소속시킴
switchport access vlan 20

! Port 활성화
no shutdown

! 전체 설정 모드로 돌아가기
exit

! 다른 Switch로 연결되는 0/23번과 0/24번 Port를 함께 선택
interface range fastEthernet0/23 - 24

! 두 Port를 여러 가상 Network를 운반하는 연결로 설정
switchport mode trunk

! 두 Port에서 10번과 20번 가상 Network의 통신을 허용
switchport trunk allowed vlan 10,20

! 선택한 두 Port 활성화
no shutdown

! 전체 설정 모드로 돌아가기
exit

! 설정 모드를 종료하고 관리자 모드로 이동
end

! 재부팅 후에도 유지되도록 설정 저장
write memory
